name: Daily Email Campaign Report

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Override "yesterday" date (YYYY-MM-DD) — leave blank for automatic'
        required: false
        default: ''

jobs:
  report:
    name: Post daily email stats to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run daily email report
        env:
          AC_API_KEY:       ${{ secrets.AC_API_KEY }}
          AC_API_URL:       ${{ secrets.AC_API_URL }}
          SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
          DATE_OVERRIDE:    ${{ github.event.inputs.date_override }}
        run: python scripts/daily_email_report.py
